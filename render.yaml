# Render Blueprint for RecoveryAI: ONE web service that serves both the API (/api/*)
# and the web app (static export of the Next.js frontend in backend/app/static).
# Models are trained offline (python -m training.run_pipeline) and committed under models/;
# no training happens on Render. Rebuild the frontend with: cd frontend && npm run export
services:
  - type: web
    name: recoveryai-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: FRONTEND_ORIGINS
        value: "*"
      # Optional: enables Claude-based structuring of discharge instructions.
      # Without it the deterministic rule-based extractor is used. Set it in the dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
